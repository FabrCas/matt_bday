# =============================================================
#  Configurazione statica del gioco
#  Modifica questi valori per calibrare titolo, economia e
#  gameplay SENZA toccare il codice. Viene letto in fase di build.
# =============================================================

# --- Debug ---
# Se true, mostra a schermo l'hitbox (bounding box) di tutti gli oggetti
# di gioco (player, ostacoli, monete), utile per calibrare le collisioni.
debug: true

# --- Testi / branding ---
game:
  title: "Birthday Runner"
  subtitle: "Raccogli più monete che puoi!"
  # Se false, nella schermata di game over non compare il bottone "rigioca"
  # (es. per disattivare i replay dopo l'evento).
  allowReplay: false
  # Testo mostrato nella schermata di auguri (raggiungibile dal bottone "continua").
  wishesMessage: "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Fusce ut luctus orci. Curabitur ac magna pharetra, finibus arcu eu, rhoncus felis. Quisque sollicitudin nec tellus nec bibendum. Curabitur tincidunt neque vitae velit finibus gravida. Vivamus eu feugiat dolor. Mauris gravida nunc eu fringilla accumsan. Nullam lobortis nec sem quis vestibulum. Praesent dictum ipsum dui, mollis molestie nibh cursus at. Suspendisse nec lectus eros. Maecenas porta euismod massa. Mauris velit nisi, faucibus vitae fringilla et, placerat quis nulla. Lorem ipsum dolor sit amet, consectetur adipiscing elit. Donec non dictum justo. Aliquam posuere dui non est dignissim ornare. Mauris mollis imperdiet ligula, nec efficitur nisl imperdiet vel. Phasellus consequat vitae enim at rhoncus. Aenean blandit quam tortor, non ornare eros vehicula non. Nullam eu nunc in ex lobortis porta. Morbi ut lectus malesuada, imperdiet turpis in, finibus nisl. Curabitur finibus massa at sem accumsan, eu ultricies leo euismod. Phasellus vitae facilisis purus, eu pellentesque nulla. Sed ut molestie magna, vitae ornare metus. Integer gravida malesuada libero quis bibendum. Morbi nunc nulla, tincidunt id erat at, eleifend viverra mi. Donec lectus ligula, pharetra et nisl sed, mattis blandit purus. Proin sed volutpat risus, commodo mattis dui. Etiam vulputate placerat nibh, at mollis justo pulvinar ac. Nulla iaculis quis enim a bibendum. Mauris quis congue tortor, non varius magna. Cras malesuada pulvinar mi quis rhoncus."

# --- Scena Auguri ---
wishes:
  galleryPlaneCount: 9    # numero di piani quadrati che orbitano intorno al testo

# --- Economia / vincita ---
economy:
  currencySymbol: "€"
  coinValue: 0.25          # valore in valuta di ogni moneta raccolta
  # Vincita massima raggiungibile (0 = nessun tetto).
  maxPayout: 100 # quota regalo

# --- Parametri di gameplay (endless runner a corsie) ---
gameplay:
  lanes: [-2.2, 0, 2.2]   # posizioni x delle 3 corsie
  startSpeed: 14          # velocità iniziale (unità/s)
  maxSpeed: 30            # velocità massima
  acceleration: 0.35      # incremento velocità nel tempo
  laneChangeSpeed: 12     # rapidità di cambio corsia
  jumpSpeed: 9            # spinta del salto
  gravity: -22            # gravità applicata in aria
  spawnAhead: 70          # distanza a cui vengono generati gli oggetti
  rowGap: 9               # distanza tra righe di ostacoli/monete
  coinRowLength: 3        # numero di monete per fila
  coinSpawnChance: 0.8    # probabilità (0..1) di spawnare monete in una riga
