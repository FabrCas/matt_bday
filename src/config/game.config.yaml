# =============================================================
#  Configurazione statica del gioco
#  Modifica questi valori per calibrare titolo, economia e
#  gameplay SENZA toccare il codice. Viene letto in fase di build.
# =============================================================

# --- Debug ---
# Se true, mostra a schermo l'hitbox (bounding box) di tutti gli oggetti
# di gioco (player, ostacoli, monete), utile per calibrare le collisioni.
debug: true

# --- Testi / branding ---
game:
  title: "Glanis Run"
  subtitle: "Guadagnati il regalo raccogliendo le monete!"
  # Se false, nella schermata di game over non compare il bottone "rigioca"
  # (es. per disattivare i replay dopo l'evento).
  allowReplay: false
  # Numero di vite: ogni ostacolo colpito ne toglie una; a 0 si va a game over.
  lives: 3
  # Testo mostrato nella schermata di auguri (raggiungibile dal bottone "continua").
  wishesMessage: "Vittoria sbloccata!\nHai superato la prova, ora puoi accedere al Boss Finale:\nscegliere come spendere la tua ricompensa.\nBuon compleanno, dottore!"

# --- Scena Menu ---
menu:
  logoWidth: 5           # larghezza del piano del logo (unità di mondo)
  # Altezza del piano = altezza visibile a schermo (a quella distanza dalla
  # camera) moltiplicata per questo fattore. Il piano resta ancorato al
  # bordo SUPERIORE dello schermo (non centrato): 0.6 = occupa la fascia
  # superiore del 60%, lasciando libero il 40% inferiore per titolo/
  # sottotitolo/bottone.
  logoHeightScale: 0.6

# --- Scena Auguri ---
wishes:
  galleryPlaneCount: 10    # numero di piani quadrati che orbitano intorno al testo

# --- Scena comandi (mostrata tra menu e game, saltata se debug: true) ---
controls:
  duration: 5              # secondi di permanenza prima di passare automaticamente al gioco

# --- Cartelloni pubblicitari del corridoio ---
billboards:
  count: 8                # numero di coppie sx/dx lungo il corridoio (riciclate come il resto)
  images:                  # pool di immagini pescate a caso, senza ripetizioni finché non escono tutte
    - "billboard_0.jpg"
    - "billboard_1.jpg"
    - "billboard_2.jpg"
    - "billboard_3.jpg"
    - "billboard_4.jpg"
    - "billboard_5.jpg"
    - "billboard_6.jpg"
    - "billboard_7.jpg"
    - "billboard_8.jpg"
    - "billboard_9.jpg"
    - "billboard_10.jpg"
    - "billboard_11.png"
    - "billboard_12.png"
    - "billboard_13.jpg"
    - "billboard_14.jpg"
    - "billboard_15.jpg"
    - "billboard_16.png"

# --- Economia / vincita ---
economy:
  currencySymbol: "€"
  coinValue: 0.25          # valore in valuta di ogni moneta raccolta
  # Vincita massima raggiungibile (0 = nessun tetto).
  maxPayout: 100 # quota regalo

# --- Parametri di gameplay (endless runner a corsie) ---
gameplay:
  lanes: [-2.2, 0, 2.2]   # posizioni x delle 3 corsie
  startSpeed: 14          # velocità iniziale (unità/s)
  maxSpeed: 30            # velocità massima
  acceleration: 0.35      # incremento velocità nel tempo
  laneChangeSpeed: 12     # rapidità di cambio corsia
  jumpSpeed: 9            # spinta del salto
  maxJumps: 2             # salti consentibili prima di ritoccare terra (2 = doppio salto)
  gravity: -22            # gravità applicata in aria
  fastFallSpeed: 10       # velocità di discesa forzata col comando "giù" durante il salto
  spawnAhead: 70          # distanza a cui vengono generati gli oggetti
  rowGap: 9               # distanza tra righe di ostacoli/monete
  coinRowLength: 3        # numero massimo di monete per fila (il numero reale varia, vedi spawnRow)
  coinSpawnChance: 0.8    # probabilità (0..1) di spawnare monete in una riga
  redCoinChance: 0.02     # probabilità (0..1) che una fila generi una moneta rossa bonus
  redCoinValueMultiplier: 10 # valore della moneta rossa = coinValue * questo fattore
  obstacleSpawnChance: 0.85 # probabilità (0..1) che una riga generi un ostacolo (il resto delle righe ne è priva)
  # Al massimo 2 blocchi orizzontali (2-3 corsie, quelli da saltare) di
  # fila: un terzo consecutivo non sarebbe superabile nemmeno col doppio
  # salto. Se capiterebbe, viene spaziato di questa distanza extra invece
  # di comparire alla distanza normale.
  extraWideBlockGap: 18
  # Pause brevi e periodiche senza alcuno spawn (né ostacoli né monete): a
  # ogni riga c'è quietStretchChance probabilità di avviarne una, lunga tra
  # quietStretchMinRows e quietStretchMaxRows righe.
  quietStretchChance: 0.05
  quietStretchMinRows: 2
  quietStretchMaxRows: 4
